<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StickyFlow - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c63ff;
            --secondary-color: #4d44db;
            --accent-color: #ff6584;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f8f9fa;
        }

        .navbar-brand {
            font-weight: 700;
            color: var(--primary-color) !important;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

            .btn-primary:hover {
                background-color: var(--secondary-color);
                border-color: var(--secondary-color);
            }

        .btn-outline-primary {
            color: var(--primary-color);
            border-color: var(--primary-color);
        }

            .btn-outline-primary:hover {
                background-color: var(--primary-color);
                color: white;
            }

        .sidebar {
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            width: 250px;
            background-color: #fff;
            border-right: 1px solid #dee2e6;
            padding-top: 1rem;
        }

            .sidebar .nav-link {
                color: #333;
                padding: 0.75rem 1.5rem;
                border-radius: 0.25rem;
                margin: 0.25rem 1rem;
            }

                .sidebar .nav-link:hover,
                .sidebar .nav-link.active {
                    background-color: var(--primary-color);
                    color: white;
                }

        .main-content {
            margin-left: 250px;
            padding: 2rem;
        }

        .note-card {
            transition: transform 0.3s ease;
        }

            .note-card:hover {
                transform: translateY(-5px);
            }

        .status-badge {
            font-size: 0.85rem;
            padding: 0.35rem 0.75rem;
        }

        .reminder-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            padding: 1.5rem;
            border-radius: 0.5rem;
        }

        .theme-toggle {
            cursor: pointer;
            font-size: 1.2rem;
        }
    </style>
</head>
<body>
    <!-- Sidebar -->
    <div class="sidebar shadow-sm">
        <div class="p-3">
            <a class="navbar-brand" href="/">
                <span style="color: var(--primary-color);">Sticky</span><span style="color: var(--accent-color);">Flow</span>
            </a>
        </div>
        <ul class="nav flex-column">
            <li class="nav-item">
                <a class="nav-link active" href="#dashboard"><i class="bi bi-house me-2"></i> Dashboard</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#notes"><i class="bi bi-sticky me-2"></i> Notes</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#reminders"><i class="bi bi-bell me-2"></i> Reminders</a>
            </li>
            <li class="nav-item">
                <a class="nav-link" href="#settings"><i class="bi bi-gear me-2"></i> Settings</a>
            </li>
            <li class="nav-item mt-5">
                <a class="nav-link text-danger" href="#" onclick="logout()"><i class="bi bi-box-arrow-right me-2"></i> Log Out</a>
            </li>
        </ul>
        <div class="p-3">
            <div class="theme-toggle" title="Toggle Theme">
                <i class="bi bi-moon-stars"></i>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-content">
        <div class="container-fluid">
            <!-- Welcome Section -->
            <div class="mb-5">
                <h2 class="fw-bold">Welcome to Your StickyFlow Dashboard</h2>
                <p class="text-muted">Manage your notes, set reminders, and track your progress with ease.</p>
            </div>

            <!-- Note Creation Form -->
            <section id="notes" class="mb-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h4 class="card-title mb-4">Create a New Note</h4>
                        <form id="noteForm">
                            <div class="mb-3">
                                <label for="noteTitle" class="form-label">Title</label>
                                <input type="text" class="form-control" id="noteTitle" placeholder="Enter note title" required>
                            </div>
                            <div class="mb-3">
                                <label for="noteContent" class="form-label">Content</label>
                                <textarea class="form-control" id="noteContent" rows="4" placeholder="Write your note..." required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-4 mb-3">
                                    <label for="notePriority" class="form-label">Priority</label>
                                    <select class="form-select" id="notePriority">
                                        <option value="low">Low</option>
                                        <option value="medium">Medium</option>
                                        <option value="high">High</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="noteStatus" class="form-label">Status</label>
                                    <select class="form-select" id="noteStatus">
                                        <option value="todo">Todo</option>
                                        <option value="in-progress">In Progress</option>
                                        <option value="done">Done</option>
                                    </select>
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label for="noteDueDate" class="form-label">Due Date</label>
                                    <input type="date" class="form-control" id="noteDueDate">
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="noteTags" class="form-label">Tags (comma-separated)</label>
                                <input type="text" class="form-control" id="noteTags" placeholder="e.g., work, personal, urgent">
                            </div>
                            <button type="submit" class="btn btn-primary">Add Note</button>
                        </form>
                    </div>
                </div>
            </section>

            <!-- Notes List -->
            <section id="notes-list" class="mb-5">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h4 class="fw-bold">Your Notes</h4>
                    <div>
                        <select class="form-select d-inline-block w-auto" id="filterStatus">
                            <option value="all">All Statuses</option>
                            <option value="todo">Todo</option>
                            <option value="in-progress">In Progress</option>
                            <option value="done">Done</option>
                        </select>
                    </div>
                </div>
                <div class="row" id="notesContainer">
                    <!-- Notes will be dynamically added here -->
                </div>
            </section>

            <!-- Reminders Section -->
            <section id="reminders" class="reminder-section mb-5">
                <h4 class="fw-bold mb-4">Upcoming Reminders</h4>
                <div id="remindersContainer">
                    <!-- Reminders will be dynamically added here -->
                </div>
            </section>

            <!-- Progress Tracking -->
            <section id="progress" class="mb-5">
                <h4 class="fw-bold mb-4">Progress Overview</h4>
                <div class="card shadow-sm">
                    <div class="card-body">
                        <canvas id="progressChart"></canvas>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script>
        // Check localStorage availability
        const storageAvailable = () => {
            try {
                const testKey = '__test__';
                localStorage.setItem(testKey, testKey);
                localStorage.removeItem(testKey);
                return true;
            } catch (e) {
                return false;
            }
        };

        const isStorageAvailable = storageAvailable();

        // Logout function
        function logout() {
            if (isStorageAvailable) {
                localStorage.removeItem('token');
            }
            window.location.href = '/';
        }

        // Theme toggle
        const themeToggle = document.querySelector('.theme-toggle');
        themeToggle.addEventListener('click', () => {
            document.body.classList.toggle('dark-mode');
            const icon = themeToggle.querySelector('i');
            icon.classList.toggle('bi-moon-stars');
            icon.classList.toggle('bi-sun');
        });

        // Note management
        let notes = isStorageAvailable ? JSON.parse(localStorage.getItem('notes') || '[]') : [];

        const noteForm = document.getElementById('noteForm');
        const notesContainer = document.getElementById('notesContainer');
        const filterStatus = document.getElementById('filterStatus');
        const remindersContainer = document.getElementById('remindersContainer');

        // Render notes
        function renderNotes(filter = 'all') {
            notesContainer.innerHTML = '';
            const filteredNotes = filter === 'all' ? notes : notes.filter(note => note.status === filter);
            filteredNotes.forEach((note, index) => {
                const dueDate = note.dueDate ? new Date(note.dueDate).toLocaleDateString() : 'No due date';
                const badgeClass = {
                    todo: 'bg-info',
                    'in-progress': 'bg-warning',
                    done: 'bg-success'
                }[note.status];
                const card = document.createElement('div');
                card.className = 'col-md-4 mb-3';
                card.innerHTML = `
                            <div class="card note-card shadow-sm">
                                <div class="card-body">
                                    <h5 class="card-title">${note.title}</h5>
                                    <p class="card-text">${note.content}</p>
                                    <p><small class="text-muted">Priority: ${note.priority}</small></p>
                                    <p><small class="text-muted">Due: ${dueDate}</small></p>
                                    <p><small class="text-muted">Tags: ${note.tags.join(', ')}</small></p>
                                    <span class="badge ${badgeClass} status-badge">${note.status}</span>
                                    <div class="mt-3">
                                        <button class="btn btn-sm btn-outline-primary me-2" onclick="editNote(${index})">Edit</button>
                                        <button class="btn btn-sm btn-outline-danger" onclick="deleteNote(${index})">Delete</button>
                                    </div>
                                </div>
                            </div>
                        `;
                notesContainer.appendChild(card);
            });
            renderReminders();
            updateProgressChart();
        }

        // Add note
        noteForm.addEventListener('submit', (e) => {
            e.preventDefault();
            if (!isStorageAvailable) {
                alert('Local storage is not available.');
                return;
            }
            const note = {
                title: document.getElementById('noteTitle').value,
                content: document.getElementById('noteContent').value,
                priority: document.getElementById('notePriority').value,
                status: document.getElementById('noteStatus').value,
                dueDate: document.getElementById('noteDueDate').value,
                tags: document.getElementById('noteTags').value.split(',').map(tag => tag.trim()).filter(tag => tag)
            };
            notes.push(note);
            localStorage.setItem('notes', JSON.stringify(notes));
            noteForm.reset();
            renderNotes(filterStatus.value);
        });

        // Delete note
        window.deleteNote = (index) => {
            notes.splice(index, 1);
            localStorage.setItem('notes', JSON.stringify(notes));
            renderNotes(filterStatus.value);
        };

        // Edit note (basic implementation)
        window.editNote = (index) => {
            const note = notes[index];
            document.getElementById('noteTitle').value = note.title;
            document.getElementById('noteContent').value = note.content;
            document.getElementById('notePriority').value = note.priority;
            document.getElementById('noteStatus').value = note.status;
            document.getElementById('noteDueDate').value = note.dueDate;
            document.getElementById('noteTags').value = note.tags.join(', ');
            deleteNote(index);
        };

        // Filter notes
        filterStatus.addEventListener('change', () => {
            renderNotes(filterStatus.value);
        });

        // Render reminders
        function renderReminders() {
            remindersContainer.innerHTML = '';
            const upcomingNotes = notes.filter(note => note.dueDate && new Date(note.dueDate) > new Date());
            if (upcomingNotes.length === 0) {
                remindersContainer.innerHTML = '<p class="text-muted">No upcoming reminders.</p>';
                return;
            }
            upcomingNotes.forEach(note => {
                const dueDate = new Date(note.dueDate).toLocaleDateString();
                const reminder = document.createElement('div');
                reminder.className = 'alert alert-info';
                reminder.innerHTML = `
                            <strong>${note.title}</strong>: Due on ${dueDate}
                            <p>${note.content}</p>
                        `;
                remindersContainer.appendChild(reminder);
            });
        }

        // Progress chart
        function updateProgressChart() {
            const ctx = document.getElementById('progressChart').getContext('2d');
            const statusCounts = {
                todo: notes.filter(n => n.status === 'todo').length,
                'in-progress': notes.filter(n => n.status === 'in-progress').length,
                done: notes.filter(n => n.status === 'done').length
            };

            ```chartjs
                    {
                        type: 'pie',
                        data: {
                            labels: ['Todo', 'In Progress', 'Done'],
                            datasets: [{
                                data: [statusCounts.todo, statusCounts['in-progress'], statusCounts.done],
                                backgroundColor: ['#36A2EB', '#FFCE56', '#4BC0C0'],
                                borderColor: ['#fff', '#fff', '#fff'],
                                borderWidth: 1
                            }]
                        },
                        options: {
                            responsive: true,
                            plugins: {
                                legend: {
                                    position: 'top',
                                    labels: {
                                        font: {
                                            family: 'Segoe UI',
                                            size: 14
                                        }
                                    }
                                }
                            }
                        }
                    }
}

// Initial render
renderNotes();
    </script>
