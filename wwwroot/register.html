<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StickyFlow - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-color: #6c63ff;
            --secondary-color: #4d44db;
        }

        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

            .btn-primary:hover {
                background-color: var(--secondary-color);
                border-color: var(--secondary-color);
            }
    </style>
</head>
<body>
    <div class="container mt-5">
        <h2 class="text-center mb-4">Register for StickyFlow</h2>
        <form id="registerForm" class="col-md-6 mx-auto">
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label for="timeZone" class="form-label">Time Zone</label>
                <input type="text" class="form-control" id="timeZone" placeholder="e.g., UTC">
            </div>
            <button type="submit" class="btn btn-primary w-100">Register</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Get query parameters
            const urlParams = new URLSearchParams(window.location.search);
            const email = urlParams.get('email') || '';
            const name = urlParams.get('name') || '';

            // Pre-fill form fields
            document.getElementById('fullName').value = name;
            document.getElementById('email').value = email;

            // Handle form submission
            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const fullName = document.getElementById('fullName').value;
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const timeZone = document.getElementById('timeZone').value || 'UTC';

                try {
                    const response = await fetch('/api/auth/register', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({ fullName, email, password, timeZone }),
                    });

                    if (response.ok) {
                        const data = await response.json();
                        alert(data.message || 'Registration successful! Please log in.');
                        window.location.href = '/login.html';
                    } else {
                        const errorData = await response.json();
                        alert(`Registration failed: ${errorData.message || 'Unknown error'}`);
                    }
                } catch (error) {
                    console.error('Registration error:', error);
                    alert('An error occurred during registration. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
