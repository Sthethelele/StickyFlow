<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StickyFlow - Register</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h2>Register</h2>
        <form id="registerForm">
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <div class="mb-3">
                <label for="fullName" class="form-label">Full Name</label>
                <input type="text" class="form-control" id="fullName" required>
            </div>
            <div class="mb-3">
                <label for="timeZone" class="form-label">Time Zone (e.g., UTC)</label>
                <input type="text" class="form-control" id="timeZone">
            </div>
            <button type="submit" class="btn btn-primary">Sign Up</button>
        </form>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // Pre-fill form with Google data if available
            const googleData = JSON.parse(localStorage.getItem('googleData') || '{}');
            if (googleData.email) {
                document.getElementById('email').value = googleData.email;
                document.getElementById('email').readOnly = true; // Prevent changing Google email
            }
            if (googleData.name) {
                document.getElementById('fullName').value = googleData.name;
            }

            document.getElementById('registerForm').addEventListener('submit', async (e) => {
                e.preventDefault();
                const email = document.getElementById('email').value;
                const password = document.getElementById('password').value;
                const fullName = document.getElementById('fullName').value;
                const timeZone = document.getElementById('timeZone').value;

                const response = await fetch('/api/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password, fullName, timeZone }),
                });

                if (response.ok) {
                    alert('Registration successful! Please log in.');
                    localStorage.removeItem('googleData'); // Clear Google data after registration
                    window.location.href = '/index.html'; // Redirect to index to sign in
                } else {
                    alert('Registration failed. Please try again.');
                }
            });
        });
    </script>
</body>
</html>
